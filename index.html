<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7FAFB" />
    <meta
      name="description"
      content="تحرير حامد حمدونة، خبيرة تحسين محركات البحث بخبرة خمس سنوات في الاستراتيجية والتحسين التقني والمحتوى."
    />
    <title>تحرير حامد حمدونة | خبيرة تحسين محركات البحث</title>
    <link rel="icon" id="site-favicon" type="image/png" href="/src/Logo/logo.png" />
    <script>
      (() => {
        const saved = localStorage.getItem("tahreer-theme");
        const savedLanguage = localStorage.getItem("tahreer-language");
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved === "light" || saved === "dark"
          ? saved
          : systemPrefersDark ? "dark" : "light";
        const language = savedLanguage === "en" ? "en" : "ar";

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
